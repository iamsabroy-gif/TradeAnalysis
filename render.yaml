# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys TradeAnalysis as a SINGLE free Render Web Service:
#   * FastAPI (backend/app/api/main.py) runs as a persistent uvicorn process.
#   * The pre-built Vite frontend in frontend/dist/ is served same-origin by
#     FastAPI's StaticFiles mount at "/", so /api/* and the UI share one domain
#     and no frontend code changes are needed.
#
# The frontend build output (frontend/dist/) is committed to the repo, so the
# Python-only build here does not need Node. If you change frontend source,
# rebuild with `cd frontend && npm install && npm run build` and commit dist/.
services:
  - type: web
    name: tradeanalysis
    runtime: python
    plan: free
    # Install Python deps only; frontend/dist is already built and committed.
    buildCommand: pip install -r requirements.txt
    # Render sets $PORT; bind uvicorn to it on all interfaces. Run from the repo
    # root so the `backend` namespace package resolves.
    startCommand: uvicorn backend.app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      # Persistence (Supabase). Leave unset to use in-memory storage (results
      # won't persist across restarts). Set both to enable durable storage.
      # These are marked sync:false so their values are entered in the Render
      # dashboard, never committed to the repo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
